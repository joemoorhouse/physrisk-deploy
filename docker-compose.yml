services:
  caddy:
    build: .
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - ui
      - api
    restart: unless-stopped

  ui:
    image: quay.io/os-climate/physrisk-ui:latest
    secrets:
      - source: baseuris
        target: /app/BaseUris.js
    restart: unless-stopped

  cache-init:
    image: alpine
    command: chown -R 1000:1000 /cache
    volumes:
      - physrisk_cache:/cache

  api:
    image: quay.io/os-climate/physrisk-api:latest
    command: fastapi run src/physrisk_api/app/main.py --port 8081 --workers 2
    env_file:
      - credentials.env
    environment:
      - PHYSRISK_CACHE_DIR=/cache
      - MALLOC_TRIM_THRESHOLD_=100000
    volumes:
      - physrisk_cache:/cache
    depends_on:
      cache-init:
        condition: service_completed_successfully
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 1.5g

volumes:
  caddy_data:
  caddy_config:
  physrisk_cache:

secrets:
  baseuris:
    file: ./BaseUris.js
