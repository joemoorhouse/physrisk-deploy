services:
  caddy:
    build: .
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - ui
      - api
    restart: unless-stopped

  ui:
    image: quay.io/os-climate/physrisk-ui:latest
    restart: unless-stopped

  api:
    image: quay.io/os-climate/physrisk-api:latest
    command: fastapi run src/physrisk_api/app/main.py --port 8081 --workers 2
    env_file:
      - .env
    restart: unless-stopped

volumes:
  caddy_data:
  caddy_config:
